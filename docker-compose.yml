name: wemeal

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://meal:${POSTGRES_PASSWORD:-meal}@db:5432/meal
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?Définir SECRET_KEY dans .env}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-meal}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Définir MINIO_ROOT_PASSWORD dans .env}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: meal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meal}
      POSTGRES_DB: meal
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meal"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes: [redis-data:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meal}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Définir MINIO_ROOT_PASSWORD dans .env}
    volumes: [minio-data:/data]

  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    command: arq app.workers.settings.WorkerSettings
    environment: *backend-env
    depends_on: [api, redis]

  web:
    build: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data]
    depends_on: [api]

volumes:
  db-data:
  redis-data:
  minio-data:
  caddy-data:
