name: wemeal

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://meal:${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}@db:5432/meal
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?Définir SECRET_KEY dans .env}
  # Fichiers sur un volume Docker par défaut ; STORAGE_BACKEND=s3 et le profil « s3 »
  # (docker compose --profile s3 up) pour les stocker dans MinIO.
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_LOCAL_PATH: /data/files
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-meal}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-50}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: meal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: meal
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meal"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes: [redis-data:/data]

  minio:
    # MinIO ne publie plus d'image sur Docker Hub : indiquer une image disponible dans MINIO_IMAGE.
    image: ${MINIO_IMAGE:-minio/minio:latest}
    profiles: [s3]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meal}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes: [minio-data:/data]

  api:
    build: ./backend
    environment: *backend-env
    volumes: [files:/data/files]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    command: arq app.workers.settings.WorkerSettings
    environment: *backend-env
    volumes: [files:/data/files]
    depends_on: [api, redis]

  web:
    build: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data]
    depends_on: [api]

volumes:
  files:
  db-data:
  redis-data:
  minio-data:
  caddy-data:
